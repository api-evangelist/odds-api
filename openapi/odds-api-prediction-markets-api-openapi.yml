              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Server-Sent Events feed for prediction-market order-book changes on one event. Read the snapshot first, then reconnect with its `resume` token as `since`. Handle `delta`, `heartbeat`, and `resync`; reload the snapshot after `resync`.
      x-rate-limit-note: Handle HTTP 429 with backoff and avoid tight polling loops.
