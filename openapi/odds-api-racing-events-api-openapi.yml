        data:
          additionalProperties: true
          type: object
          title: Data
      type: object
      required:
      - event_id
      - data
      title: RacingEventDetail
    RacingEventSummary:
      properties:
        event_id:
          type: string
          title: Event Id
          description: Canonical racing event identifier (raceID).
        race_start_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Race Start Time
          description: Unix seconds.
        race_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Race Type
        race_venue:
          anyOf:
          - type: string
          - type: 'null'
          title: Race Venue
        race_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Race Number
        race_state:
          anyOf:
          - type: string
          - type: 'null'
          title: Race State
        race_country:
          anyOf:
          - type: string
          - type: 'null'
          title: Race Country
        race_distance:
          anyOf:
          - type: string
          - type: 'null'
          title: Race Distance
        active_runners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Active Runners
          description: Best available active-runner count after known scratchings.
        total_runners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Runners
          description: Declared field size before known scratchings, when available.
        scratched_runners:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scratched Runners
          description: Known scratched/removed runner count.
        runner_count_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Runner Count Source
          description: Bookmaker or schedule source used for the runner count.
        runner_count_updated_at_ts:
          anyOf:
          - type: integer
          - type: 'null'
          title: Runner Count Updated At Ts
          description: Runner-count source time in Unix seconds.
        runner_count_complete:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Runner Count Complete
          description: True only when the source declares state for the complete field.
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: Event lifecycle status. An open event can already have early bookmaker odds; fetching denotes active near-jump collection. Distinct from bookmaker snapshot statuses such as ok. Omit the status filter when discovering early races.
        bookmaker_links:
          additionalProperties: true
          type: object
          title: Bookmaker Links
        scrapping_links:
          additionalProperties: true
          type: object
          title: Scrapping Links
        last_capture:
          anyOf:
          - type: integer
          - type: 'null'
