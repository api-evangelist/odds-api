name: Odds API
description: >-
  OpenAPI-first sports betting odds API (odds-api.net) providing bookmaker odds, odds comparison, arbitrage, positive
  EV, line movement, and racing/sports coverage via REST plus SSE and WebSocket streaming. Agent-native with an MCP
  server, llms.txt, and agent instruction files, plus TypeScript and Python SDKs.
url: https://raw.githubusercontent.com/api-evangelist/odds-api/refs/heads/main/apis.yml
created: '2026-09-17'
modified: '2026-09-17'
specificationVersion: '0.21'
tags:
