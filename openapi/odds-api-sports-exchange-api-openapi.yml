  /events/{event_id}/exchange/markets:
    get:
      tags:
      - Sports exchange
      summary: 'In-play exchange: Discover markets'
      description: Lists available Betfair markets across sports, including soccer and cricket. Supply a WagerWise event ID or id_type=betfair with a native Betfair event ID. Filter using market_types; MATCH_ODDS is sorted first. Use the returned opaque market_id values with the multiplexed WebSocket; do not send Betfair market names or IDs.
      operationId: exchange_markets_events__event_id__exchange_markets_get
      security:
      - ApiKeyAuth: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
        description: Canonical event or race identifier from an event list response.
      - name: exchange
        in: query
        required: false
        schema:
          type: string
          pattern: ^betfair$
          default: betfair
          title: Exchange
      - name: id_type
        in: query
        required: false
        schema:
          type: string
          pattern: ^(wagerwise|betfair)$
          description: Namespace of event_id; Betfair IDs are numeric event IDs, not market IDs.
          default: wagerwise
          title: Id Type
        description: Namespace of event_id; Betfair IDs are numeric event IDs, not market IDs.
      - name: market_types
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          description: Optional comma-separated Betfair market types, e.g. MATCH_ODDS,OVER_UNDER_25.
          title: Market Types
        description: Optional comma-separated Betfair market types, e.g. MATCH_ODDS,OVER_UNDER_25.
