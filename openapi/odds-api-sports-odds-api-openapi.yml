components:
  schemas:
    StreamHeartbeat:
      type: object
      description: Heartbeat payload. All streams use it as a liveness signal; event-odds streams also include the latest event and bookmaker freshness metadata so a no-price-change capture is observable.
      additionalProperties: false
      properties:
        event_id:
          type: string
          nullable: true
        resume:
          type: string
          nullable: true
        as_of_ts_ms:
          type: integer
          nullable: true
        snapshot_capture_ts_ms:
          type: integer
          nullable: true
        bookmaker_as_of_ts_ms:
          type: object
          additionalProperties:
            type: integer
        oldest_bookmaker_as_of_ts_ms:
          type: integer
          nullable: true
        target_refresh_interval_seconds:
          type: integer
          nullable: true
    OddsStreamDelta:
      properties:
        op:
          title: Op
          type: string
        odd:
          $ref: '#/components/schemas/OddLine'
      required:
      - op
      - odd
      title: OddsStreamDelta
      type: object
    OddsHistoryMeta:
      properties:
        from_ts:
          type: string
          format: date-time
          title: From Ts
        to_ts:
          type: string
          format: date-time
          title: To Ts
        available_price_types:
          items:
            type: string
          type: array
          title: Available Price Types
        source:
          type: string
          title: Source
          default: unknown
        degraded:
          type: boolean
          title: Degraded
          default: false
        degraded_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Degraded Reason
      type: object
      required:
      - from_ts
      - to_ts
      - available_price_types
      title: OddsHistoryMeta
    OddsStreamEvent:
      properties:
        event_id:
          title: Event Id
          type: string
        resume:
          title: Resume
          type: string
        changes:
          items:
            $ref: '#/components/schemas/OddsStreamDelta'
          title: Changes
          type: array
        snapshot_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Snapshot Id
        batch_index:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Batch Index
        batch_count:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Batch Count
      required:
      - event_id
      - resume
      - changes
      title: OddsStreamEvent
      type: object
    RateLimitResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      description: Rate-limit response. Retry after the window or reduce polling frequency.
    OddLine:
      properties:
        id:
          type: string
          title: Id
        event_id:
          type: string
          title: Event Id
        bookmaker:
          type: string
          title: Bookmaker
        bookmaker_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookmaker Name
        source_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Type
        exchange:
          anyOf:
          - type: string
          - type: 'null'
          title: Exchange
        exchange_market_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Exchange Market Id
        exchange_selection_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Exchange Selection Id
        selection_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Selection Key
        market_group_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Market Group Id
        market_key:
          type: string
          title: Market Key
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        bet_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Bet Type
        period:
          anyOf:
          - type: integer
          - type: string
          title: Period
        period_str:
          anyOf:
          - type: string
          - type: 'null'
          title: Period Str
        metric:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric
        line:
          anyOf:
          - type: string
          - type: 'null'
          title: Line
        side:
          anyOf:
          - type: string
          - type: 'null'
          title: Side
        player_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Player Name
        selection_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Selection Name
        market_contract:
          anyOf:
