name: Odds API MCP Server
description: >-
  Official MCP server for sports and racing odds workflows. Distributed as a
  locally-run stdio package (npx @odds-api/mcp); wraps the Odds API REST V1
  contract as agent tools, including bookmaker comparison, arbitrage, positive
  EV, line movement, racing odds, results, and bounded stream sampling.
deployment:
  mode: local-stdio
  endpoint: null
  install: "npx @odds-api/mcp"
  package: https://www.npmjs.com/package/@odds-api/mcp
  auth: api-key
  verified: searched
config:
  client_example: |
    {
      "mcpServers": {
        "odds-api": {
          "command": "npx",
          "args": ["@odds-api/mcp"],
          "env": {
            "ODDS_API_KEY": "your_api_key",
            "ODDS_API_BASE_URL": "https://api.odds-api.net/v1"
          }
        }
      }
    }
  mock_mode: "ODDS_API_MOCK=1 npx @odds-api/mcp"
  env:
    - ODDS_API_KEY
    - ODDS_API_BASE_URL
    - ODDS_API_MOCK
