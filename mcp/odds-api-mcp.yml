notes: >-
  Not a hosted/remote MCP endpoint — an agent cannot reach it by URL; a human
  installs and runs it over stdio first. The server calls the Odds API REST V1
  with an X-API-Key. Optional server-side stream-broker tools (open/read/list/
  close_stream) let the process act as a bounded SSE/WebSocket broker; the
  documented production path connects to the raw SSE/WS endpoints from a backend.
