components:
  schemas:
    RacingOddsStreamEvent:
      properties:
        event_id:
          title: Event Id
          type: string
        resume:
          title: Resume
          type: string
        changes:
          items:
            $ref: '#/components/schemas/RacingOddsStreamDelta'
          title: Changes
          type: array
      required:
      - event_id
      - resume
      - changes
      title: RacingOddsStreamEvent
      type: object
    RacingOddsBookmakerSnapshot:
      properties:
        bookmaker_name:
          type: string
          title: Bookmaker Name
        race_id:
          type: string
          title: Race Id
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: Bookmaker snapshot status, distinct from event status. Early prices use ok; near-jump collection uses fetching. Both may contain valid prices; do not require fetching to read odds. Other statuses may occur; inspect runner prices and timestamps.
        total_matched:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Matched
          description: Cumulative amount matched on the exchange WIN market in the source feed's currency. Betfair racing is currently requested in AUD.
        updated_at_ts:
          anyOf:
          - type: integer
          - type: 'null'
          title: Updated At Ts
          description: Snapshot update time in Unix seconds. On compact clients, request include_source=true to include it.
        payload:
          additionalProperties: true
          type: object
          title: Payload
          description: Bookmaker-specific payload, omitted when include_raw_payload=false (the compact default). Sportsbet WIN prices use payload.horse_data[].odds, with horse_name and number; payload.runners[].win_odds is not a universal raw schema.
          examples:
          - horse_data:
            - horse_name: Example Runner
              number: '1'
              odds: 3.4
            status: ok
        runners:
          items:
            properties:
              runner_number:
                anyOf:
                - type: string
                - type: integer
                - type: 'null'
                title: Runner Number
              runner_name:
                anyOf:
                - type: string
                - type: 'null'
                title: Runner Name
              win_odds:
                anyOf:
                - type: number
                - type: string
                - type: 'null'
                title: Win Odds
                description: Decimal WIN price, when supplied.
              place_odds:
                anyOf:
                - type: number
                - type: string
                - type: 'null'
                title: Place Odds
                description: Decimal PLACE price, when supplied.
              jockey_name:
                anyOf:
                - type: string
                - type: 'null'
                title: Jockey Name
              trainer_name:
                anyOf:
                - type: string
