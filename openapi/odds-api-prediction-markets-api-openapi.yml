components:
  schemas:
    PredictionOrderBookStreamEvent:
      properties:
        event_id:
          title: Event Id
          type: string
        resume:
          title: Resume
          type: string
        changes:
          items:
            $ref: '#/components/schemas/PredictionOrderBookStreamDelta'
          title: Changes
          type: array
      required:
      - event_id
      - resume
      - changes
      title: PredictionOrderBookStreamEvent
      type: object
    RateLimitResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      description: Rate-limit response. Retry after the window or reduce polling frequency.
    StreamResyncEvent:
      type: object
      description: Sent when a resume token is no longer available and the client should reload the snapshot.
      required:
      - reason
      properties:
        event_id:
          type: string
          nullable: true
        selection_key:
          type: string
          nullable: true
        resume:
          type: string
          nullable: true
        reason:
          type: string
          example: trimmed
        snapshot_id:
          type: string
          nullable: true
    PredictionPriceLevel:
      properties:
        price:
          type: number
          exclusiveMaximum: 1.0
          exclusiveMinimum: 0.0
          title: Price
        size:
          type: number
          minimum: 0.0
          title: Size
      type: object
      required:
      - price
      - size
      title: PredictionPriceLevel
    PredictionContractBook:
      properties:
        contract_id:
          type: string
          title: Contract Id
        source_contract_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Contract Id
        contract_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Contract Name
        outcome:
          type: string
          title: Outcome
        side:
          anyOf:
          - type: string
          - type: 'null'
          title: Side
        line:
          anyOf:
          - type: string
          - type: 'null'
          title: Line
        player_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Player Name
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        probability_bids:
          items:
            $ref: '#/components/schemas/PredictionPriceLevel'
          type: array
          title: Probability Bids
        probability_asks:
          items:
            $ref: '#/components/schemas/PredictionPriceLevel'
          type: array
          title: Probability Asks
        best_bid_probability:
          anyOf:
