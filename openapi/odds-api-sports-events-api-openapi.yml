components:
  schemas:
    EventListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/EventSummary'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        count:
          type: integer
          title: Count
      type: object
      required:
      - items
      - count
      title: EventListResponse
    BookmakersResponse:
      properties:
        event_id:
          type: string
          title: Event Id
        items:
          items:
            type: string
          type: array
          title: Items
      type: object
      required:
      - event_id
      - items
      title: BookmakersResponse
    RateLimitResponse:
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      description: Rate-limit response. Retry after the window or reduce polling frequency.
    OpportunityCounts:
      properties:
        positive_ev:
          type: integer
          title: Positive Ev
          default: 0
        arbitrage:
          type: integer
          title: Arbitrage
          default: 0
        middle:
          type: integer
          title: Middle
          default: 0
        bonus_conversion:
          type: integer
          title: Bonus Conversion
          default: 0
      type: object
      title: OpportunityCounts
    ErrorResponse:
      type: object
      required:
      - detail
      properties:
        detail:
          description: Human-readable error detail. FastAPI may return a string or a validation-error object.
          oneOf:
          - type: string
          - type: object
          - type: array
            items:
              type: object
        code:
          type: string
          description: Optional stable error code when provided by the endpoint.
        request_id:
          type: string
          description: Optional request identifier for support/debugging.
    EventSummary:
      properties:
        event_id:
          type: string
          title: Event Id
          description: Canonical event identifier (game_masterID).
        sport:
          anyOf:
          - type: string
          - type: 'null'
          title: Sport
        league:
          anyOf:
          - type: string
          - type: 'null'
          title: League
          description: League name representation.
        start_time:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Time
          description: Unix seconds.
        home_team:
          anyOf:
          - type: string
          - type: 'null'
          title: Home Team
        away_team:
          anyOf:
          - type: string
          - type: 'null'
          title: Away Team
        event_state:
          anyOf:
          - type: string
          - type: 'null'
          title: Event State
          description: Effective lifecycle state, including inferred start_time_passed.
        event_state_certainty:
          anyOf:
          - type: string
          - type: 'null'
          title: Event State Certainty
        event_state_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Event State Source
        state_observed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: State Observed At
          description: Unix seconds.
        actual_started_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actual Started At
          description: Unix seconds.
        last_live_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Live At
          description: Unix seconds.
        finished_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Finished At
          description: Unix seconds.
        live_candidate:
          type: boolean
          title: Live Candidate
          default: false
        event_state_stale:
          type: boolean
          title: Event State Stale
          default: false
        has_available_bets:
          type: boolean
          title: Has Available Bets
          description: Whether the event currently has at least one live normalized odds line.
          default: false
        last_capture:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Capture
          description: Unix seconds.
        bookmakers:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          type: object
          title: Bookmakers
          description: Bookmaker -> odds_data_id.
        league_image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: League Image Url
          description: Azure-hosted league image URL when configured for this league.
        league_image_asset_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: League Image Asset Slug
          description: Storage slug for the configured Azure-hosted league image.
        home_team_logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Home Team Logo Url
          description: Azure-hosted home-team logo URL when matched for this event.
        away_team_logo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Away Team Logo Url
          description: Azure-hosted away-team logo URL when matched for this event.
        team_logo_manifest_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Logo Manifest Url
          description: Azure-hosted per-league team-logo manifest URL when configured.
        opportunity_counts:
          anyOf:
          - $ref: '#/components/schemas/OpportunityCounts'
          - type: 'null'
          description: Aggregate live opportunity counts when requested.
      type: object
      required:
      - event_id
      title: EventSummary
    EventDetail:
      properties:
        event_id:
          type: string
          title: Event Id
        data:
          additionalProperties: true
          type: object
          title: Data
      type: object
      required:
      - event_id
      - data
      title: EventDetail
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Send your API key in this header on every request.
